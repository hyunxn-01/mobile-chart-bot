<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벽걸이 TV · 견본 15</title>
<style>
:root{--bg:#07090d;--tile:#11151c;--line:#232a35;--ink:#f2f5f9;--sub:#8a95a6;--hot:#ffcc33;--up:#36d399;--down:#ff6b5b;--band:#ffcc33;--bandink:#14110a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:hidden}
a{color:var(--sub)}
.tv{min-height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.2vw;padding:1.4vw 1.8vw}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.top b{color:var(--ink);font-size:15px;letter-spacing:.04em}
.top .live{display:inline-flex;align-items:center;gap:6px}
.top .live i{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
.mid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.2vw;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:1.2vw}
.t{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:1.2vw 1.4vw;display:flex;flex-direction:column;justify-content:space-between;min-height:150px;overflow:hidden}
.t .l{font-size:clamp(13px,1.05vw,17px);color:var(--sub)}
.t .v{font-size:clamp(44px,5.6vw,96px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t .v.s{font-size:clamp(22px,2.2vw,38px);line-height:1.15;letter-spacing:-.01em;word-break:keep-all}
.t .f{font-size:clamp(12px,.95vw,15px);color:var(--sub)}
.t.mk{border-color:#3a3220}
.t.mk .l{color:var(--hot)}
.up{color:var(--up)}.down{color:var(--down)}
.rank{background:var(--tile);border:1px solid #3a3220;border-radius:14px;padding:1.2vw 1.4vw;display:flex;flex-direction:column;min-height:0}
.rank h2{margin:0 0 .6vw;font-size:clamp(15px,1.3vw,22px);color:var(--hot)}
.rank .sub{font-size:12.5px;color:var(--sub);margin-bottom:.8vw}
.bars{display:flex;flex-direction:column;gap:.9vw;flex:1;justify-content:center}
.bar .nm{display:flex;justify-content:space-between;gap:8px;font-size:clamp(14px,1.15vw,20px);font-weight:600}
.bar .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .nm span:last-child{color:var(--sub);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.bar .tr{height:clamp(10px,1vw,16px);background:#1d232d;border-radius:99px;margin-top:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--hot);border-radius:99px;transition:width .6s}
.dots{display:flex;gap:6px;margin-top:.8vw}
.dots i{width:22px;height:4px;border-radius:2px;background:#2b3340}
.dots i.on{background:var(--hot)}
.band{background:var(--band);color:var(--bandink);border-radius:16px;padding:1.4vw 2vw 1.2vw;min-height:30vh;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden}
.band .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:clamp(13px,1.05vw,17px);font-weight:700;letter-spacing:.02em}
.band .meta .src{background:var(--bandink);color:var(--band);border-radius:6px;padding:2px 10px}
.band .hl{font-size:clamp(24px,3.1vw,54px);font-weight:800;line-height:1.22;letter-spacing:-.015em;margin:.8vw 0;word-break:keep-all}
.band .hl b{font-weight:900;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em}
.band .hl .mk-up,.band .hl .mk-down{background:var(--bandink);color:var(--band);border-radius:6px;padding:0 .2em}
.band .foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;flex-wrap:wrap}
.band .prog{position:absolute;left:0;bottom:0;height:5px;background:var(--bandink);width:0}
.band.paused .prog{opacity:.25}
.fade{animation:f .5s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mk-err{background:#3a1512;border:1px solid #7a2a22;color:#ffd9d4;padding:12px 14px;border-radius:8px;margin:16px}
.mk-err code{color:#fff}
@media (max-width:900px){.mid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tv{padding:16px;gap:14px}.t,.rank{padding:14px}.band{padding:18px;min-height:0}}
@media (max-width:420px){.t .v{font-size:40px}.t{min-height:120px}}
</style>
</head>
<body>
<div class="tv">
  <div class="top">
    <span><b>견본 15 · 벽걸이 TV</b> &nbsp;<span id="intro"></span></span>
    <span class="live"><i></i><span id="stamp">불러오는 중…</span> · <a href="index.html">견본 목록</a></span>
  </div>
  <div class="mid">
    <div class="tiles" id="tiles"></div>
    <div class="rank" id="rank"></div>
  </div>
  <div class="band" id="band" title="누르면 멈춤 / 다시 누르면 재생" role="region" aria-label="AI 헤드라인" aria-live="polite"></div>
</div>
<script>/*MK-CORE-BEGIN*/
/* MK core — 견본 공통 도우미(각 견본 HTML 안에 그대로 들어 있다. 원본: 견본 작업 세션의 core.js)
   데이터: 저장소 루트에서 정적 서버로 열었을 때 ../docs/markets/ 아래 JSON을 읽는다. */
(function () {
  'use strict';
  const BASE = '../docs/markets/';
  const cache = {};
  const CC = {
    global: '전 시장', cn: '중국', jp: '일본', kr: '한국', tw: '대만', us: '미국', ae: 'UAE', ar: '아르헨티나', au: '호주',
    br: '브라질', ca: '캐나다', co: '콜롬비아', de: '독일', eg: '이집트', es: '스페인', fr: '프랑스', gb: '영국',
    id: '인도네시아', in: '인도', it: '이탈리아', mx: '멕시코', my: '말레이시아', nl: '네덜란드', ph: '필리핀',
    pk: '파키스탄', ru: '러시아', sa: '사우디', se: '스웨덴', sg: '싱가포르', th: '태국', tr: '터키', vn: '베트남',
    europe: '유럽', na_oceania: '북미·오세아니아', middle_east: '중동', latam: '중남미', sea: '동남아', south_asia: '남아시아'
  };
  const MAJORS = ['kr', 'us', 'jp', 'cn', 'tw'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  async function json(name) {
    if (cache[name]) return cache[name];
    const url = BASE + name + '.json';
    cache[name] = fetch(url).then(r => {
      if (!r.ok) throw new Error(url + ' 응답 ' + r.status);
      return r.json();
    });
    try { return await cache[name]; } catch (e) { delete cache[name]; throw e; }
  }
  function name(k) { return CC[k] || (k ? String(k).toUpperCase() : ''); }
  function briefFile(tab) {
    if (!tab || tab.key === 'global' || tab.type === 'global') return 'global_brief';
    return (tab.type === 'major' ? 'major_' : 'region_') + tab.key;
  }
  /* 브리핑 목록: [{key,type,name,file}] — 맨 앞은 전 시장 */
  async function briefTabs() {
    const idx = await json('briefs_index');
    return [{ key: 'global', type: 'global', name: '전 시장', file: 'global_brief' }]
      .concat((idx.tabs || []).map(t => ({ key: t.key, type: t.type, name: t.name, countries: t.countries, file: briefFile(t) })));
  }
  /* 브리핑 한 개: {tab, generated, text, history:[{date,text}], monthly, quarterly} */
  async function brief(tab) {
    const d = await json(tab.file || briefFile(tab));
    const w = (d.axes && d.axes.weekly) || { text: d.text, history: d.history, generated: d.generated };
    return {
      tab, raw: d, generated: w.generated || d.generated, text: w.text || d.text || '', model: w.model || '',
      history: (w.history || d.history || []).map(h => ({ date: h.date, generated: h.generated, text: h.text })),
      monthly: d.axes && d.axes.monthly ? d.axes.monthly.text : '', quarterly: d.axes && d.axes.quarterly ? d.axes.quarterly.text : ''
    };
  }
  async function allBriefs() {
    const tabs = await briefTabs();
    return Promise.all(tabs.map(t => brief(t)));
  }
  /* 브리핑 글 → 섹션. 섹션의 첫 항목이 헤드라인(요약), 나머지가 상세. '- '로 시작하지 않는 줄은 앞 항목에 붙는 인용(매체 인용문). */
  function parseBrief(text) {
    const out = [];
    let sec = null, last = null;
    String(text || '').split('\n').forEach(line => {
      const l = line.replace(/\s+$/, '');
      if (!l.trim()) return;
      const h = l.match(/^#{1,3}\s+(.*)$/);
      if (h) { sec = { title: h[1].trim(), items: [] }; out.push(sec); last = null; return; }
      if (!sec) { sec = { title: '', items: [] }; out.push(sec); }
      const b = l.match(/^\s*[-*]\s+(.*)$/);
      if (b) { last = { md: b[1].trim(), quotes: [] }; sec.items.push(last); return; }
      if (last) last.quotes.push(l.trim()); else { last = { md: l.trim(), quotes: [] }; sec.items.push(last); }
    });
    out.forEach(s => {
      s.headline = s.items.length ? s.items[0] : null;
      s.details = s.items.slice(1);
      s.items.forEach(it => {
        it.text = plain(it.md + (it.quotes.length ? ' ' + it.quotes.join(' ') : ''));
        it.full = it.quotes.length ? it.md + ' “' + it.quotes.join(' ') + '”' : it.md;
      });
    });
    return out;
  }
  /* 인라인 마크다운(굵게, 링크, ▲▼ 숫자) → HTML */
  function md(s, opt) {
    opt = opt || {};
    let h = esc(s);
    h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => opt.noLinks ? t : '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>');
    h = h.replace(/\*\*([^*]+)\*\*/g, (m, t) => '<b>' + t + '</b>');
    h = h.replace(/▲\s?(\d+(?:\.\d+)?)/g, '<span class="mk-up">▲$1</span>').replace(/▼\s?(\d+(?:\.\d+)?)/g, '<span class="mk-down">▼$1</span>');
    if (opt.mark && opt.mark.length) {
      opt.mark.filter(Boolean).forEach(w => {
        const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'g');
        h = h.replace(re, '<mark>$1</mark>');
      });
    }
    return h;
  }
  function itemHtml(it, opt) {
    let h = md(it.md, opt);
    if (it.quotes && it.quotes.length) h += ' <q class="mk-q">' + md(it.quotes.join(' '), opt) + '</q>';
    return h;
  }
  function plain(s) { return String(s || '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\*\*/g, ''); }
  function bolds(s) { const r = []; String(s || '').replace(/\*\*([^*]+)\*\*/g, (m, t) => { r.push(t.trim()); }); return r; }
  function links(s) { const r = []; String(s || '').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => { r.push({ t, u }); }); return r; }
  function moves(s) { const r = []; String(s || '').replace(/([▲▼])\s?(\d+(?:\.\d+)?)/g, (m, a, v) => { r.push({ dir: a === '▲' ? 1 : -1, v: +v }); }); return r; }
  /* 시사점 문장 끝 괄호(근거) 떼기 */
  function evidence(s) {
    const t = String(s || '').trim();
    if (!t.endsWith(')')) return { claim: t, evidence: '' };
    let depth = 0;
    for (let i = t.length - 1; i >= 0; i--) {
      if (t[i] === ')') depth++;
      else if (t[i] === '(') { depth--; if (depth === 0) return { claim: t.slice(0, i).trim(), evidence: t.slice(i + 1, -1).trim() }; }
    }
    return { claim: t, evidence: '' };
  }
  /* 권고 문장의 신호(규칙 기반): go 우선 · watch 관망 · hold 보류 */
  /* 강한 표현이 약한 표현보다 먼저 판정한다. 관망 표현이 있으면 관망. 우선 · 보류 강한 표현이 함께 있으면 혼재. */
  const SIG = {
    watch: ['확인 후', '불확실', '2~3주', '구분 불가', '미룸', '관망', '아직 이름', '판단 근거로 쓰기에는'],
    holdStrong: ['보류', '하향', '후순위'],
    goStrong: ['우선순위 상위', '1순위', '진출 우선'],
    holdWeak: ['포화', '리스크가 큼', '리스크 큼', '어려', '제한적', '여지가 없'],
    goWeak: ['유지', '유리', '기회', '현실적', '낮은 편', '가능']
  };
  function signal(text) {
    const t = plain(text);
    const hit = {};
    Object.keys(SIG).forEach(k => { hit[k] = SIG[k].filter(w => t.includes(w)); });
    let s = null;
    if (hit.watch.length) s = 'watch';
    else if (hit.goStrong.length && hit.holdStrong.length) s = 'mixed';
    else if (hit.holdStrong.length) s = 'hold';
    else if (hit.goStrong.length) s = 'go';
    else if (hit.holdWeak.length && hit.goWeak.length) s = 'mixed';
    else if (hit.holdWeak.length) s = 'hold';
    else if (hit.goWeak.length) s = 'go';
    const words = [].concat(hit.watch, hit.goStrong, hit.holdStrong, hit.goWeak, hit.holdWeak);
    return { signal: s, hits: hit, words };
  }
  const SIGNAL_LABEL = { go: '우선', watch: '관망', hold: '보류', mixed: '혼재' };
  const SIGNAL_RULES = SIG;
  /* 주간 순위 요약(weekly_lite) 한 시장 */
  function weekly(lite, mk, chart) {
    const c = (((lite || {}).markets || {})[mk] || {}).charts || {};
    const ch = c[chart || 'grossing'] || { games: {}, timeframes: { weekly: { labels: [], series: {} } } };
    const tf = ch.timeframes.weekly, labels = tf.labels || [], n = labels.length, ni = n - 1, pi = n - 2;
    const rows = Object.keys(tf.series).map(id => {
      const v = tf.series[id], g = ch.games[id] || {};
      const now = v[ni] == null ? null : v[ni], prev = v[pi] == null ? null : v[pi];
      return { id, title: g.title || id, dev: g.developer || '', icon: g.icon || '', now, prev, series: v,
        delta: now != null && prev != null ? +(prev - now).toFixed(1) : null, isNew: now != null && prev == null, isOut: now == null && prev != null };
    });
    rows.sort((a, b) => (a.now == null ? 999 : a.now) - (b.now == null ? 999 : b.now));
    /* 주마다 1위(평균 순위가 가장 낮은 게임) */
    const tops = [];
    for (let i = 0; i < n; i++) {
      let best = null, ba = null;
      for (const id in tf.series) { const x = tf.series[id][i]; if (x != null && (best == null || x < best)) { best = x; ba = id; } }
      tops.push(ba);
    }
    let streak = 0; const top = tops[ni];
    for (let i = ni; i >= 0 && tops[i] === top; i--) streak++;
    return { labels, n, rows, tops, top, topStreak: streak, games: ch.games, series: tf.series };
  }
  /* 나라 파일(<cc>.json)의 주간 시계열 전체 */
  function countryWeekly(co, chart) {
    const ch = ((co || {}).charts || {})[chart || 'grossing'] || {};
    const tf = (ch.timeframes || {}).weekly || { labels: [], series: {} };
    return { labels: tf.labels || [], series: tf.series || {}, games: ch.games || {}, publishers: ch.publishers, genres: ch.genres, daily: (ch.timeframes || {}).daily, monthly: (ch.timeframes || {}).monthly };
  }
  /* 여러 나라 순위 요약(xmarket_lite) 풀기 */
  function xm(x) {
    const mk = x.markets || [];
    const games = {};
    Object.keys(x.games || {}).forEach(id => {
      const g = x.games[id];
      const o = { id, title: g.t, dev: g.d, icon: g.i ? (x.icon_head + g.i + x.icon_tail) : '', genre: g.gr || '', release: g.rl, updated: g.up, g: {}, f: {} };
      (g.g || []).forEach(r => { o.g[mk[r[0]]] = { now: r[1], prev: r[2] }; });
      (g.f || []).forEach(r => { o.f[mk[r[0]]] = { now: r[1], prev: r[2] }; });
      games[id] = o;
    });
    function top(cc, kind, n) {
      kind = kind || 'g';
      return Object.values(games).filter(o => o[kind][cc] && o[kind][cc].now != null)
        .sort((a, b) => a[kind][cc].now - b[kind][cc].now).slice(0, n || 100);
    }
    return { date: x.date, markets: mk, games, top };
  }
  function genreShares(gm, key) {
    const c = (gm.cells || {})[key] || {};
    return Object.keys(c).map(g => ({ genre: g, rev: c[g].rev, pre: c[g].pre })).sort((a, b) => b.rev - a.rev);
  }
  /* SVG 도우미 */
  function spark(vals, o) {
    o = Object.assign({ w: 120, h: 28, invert: false, stroke: 'currentColor', width: 1.5, fill: '', dot: true, min: null, max: null, pad: 2 }, o || {});
    const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
    if (!pts.length) return '<svg width="' + o.w + '" height="' + o.h + '"></svg>';
    const ys = pts.map(p => p[1]);
    const mn = o.min != null ? o.min : Math.min.apply(null, ys), mx = o.max != null ? o.max : Math.max.apply(null, ys);
    const X = i => o.pad + (vals.length < 2 ? 0 : i * (o.w - 2 * o.pad) / (vals.length - 1));
    const Y = v => { const t = mx === mn ? 0.5 : (v - mn) / (mx - mn); return o.pad + (o.invert ? t : 1 - t) * (o.h - 2 * o.pad); };
    let d = '', seg = false;
    vals.forEach((v, i) => { if (v == null) { seg = false; return; } d += (seg ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); seg = true; });
    const lp = pts[pts.length - 1];
    let s = '<svg class="mk-spark" width="' + o.w + '" height="' + o.h + '" viewBox="0 0 ' + o.w + ' ' + o.h + '" aria-hidden="true">';
    if (o.band) s += '<rect x="0" y="' + Math.min(Y(o.band[0]), Y(o.band[1])).toFixed(1) + '" width="' + o.w + '" height="' + Math.abs(Y(o.band[0]) - Y(o.band[1])).toFixed(1) + '" fill="' + (o.bandFill || 'rgba(0,0,0,.08)') + '"/>';
    s += '<path d="' + d + '" fill="none" stroke="' + o.stroke + '" stroke-width="' + o.width + '" stroke-linejoin="round" stroke-linecap="round"/>';
    if (o.dot) s += '<circle cx="' + X(lp[0]).toFixed(1) + '" cy="' + Y(lp[1]).toFixed(1) + '" r="' + (o.width + 1) + '" fill="' + (o.dotColor || o.stroke) + '"/>';
    return s + '</svg>';
  }
  function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function errBox(target, e) {
    const node = typeof target === 'string' ? document.querySelector(target) : target;
    const msg = '<div class="mk-err" role="alert"><b>데이터를 불러오지 못했습니다.</b> ' + esc(e && e.message ? e.message : e) +
      '<br>저장소 루트에서 정적 서버를 띄우고(<code>python3 -m http.server</code>) <code>/mockups/</code> 아래 주소로 열어 주세요.</div>';
    if (node) node.innerHTML = msg; else document.body.insertAdjacentHTML('afterbegin', msg);
    console.warn('[MK] load failed', e);
  }
  function icon(url, cls) { return url ? '<img class="' + (cls || 'mk-icon') + '" src="' + esc(url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'">' : '<span class="' + (cls || 'mk-icon') + '"></span>'; }
  function wk(label) { if (!label) return ''; const p = label.split('-'); return (+p[1]) + '/' + (+p[2]) + ' 주'; }
  function day(s) { if (!s) return ''; const p = String(s).slice(0, 10).split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
  function n1(v) { return v == null || isNaN(v) ? '–' : (Math.round(v * 10) / 10).toFixed(1); }
  function fmt(v, d) { return v == null || isNaN(v) ? '–' : Number(v).toLocaleString('ko-KR', { maximumFractionDigits: d == null ? 0 : d }); }
  /* 이름 비교용: 공백 · 기호를 빼고 소문자 */
  function norm(s) { return String(s || '').toLowerCase().replace(/[\s:：·・\-_'’"“”()（）\[\]!！?？.,®™]/g, ''); }
  /* 브리핑 문장에서 이름이 나온 게임 찾기: games = [{id,title}] */
  function findGames(text, games) {
    const names = bolds(text).map(norm).filter(x => x.length >= 2);
    const t = norm(plain(text));
    return games.filter(g => { const n = norm(g.title); if (n.length < 2) return false; return names.some(b => b === n || (b.length >= 3 && (n.startsWith(b) || b.startsWith(n)))) || (n.length >= 4 && t.includes(n)); });
  }
  /* 화면이 다 그려졌는지 확인 스크립트에 알린다 */
  function ready(ok, note) { document.documentElement.setAttribute('data-mk-ready', ok ? 'ok' : 'error'); if (note) document.documentElement.setAttribute('data-mk-note', note); }
  const PROJECT = '앱스토어(App Store) 31개국 게임 매출 · 인기 차트를 매일 모으고, Claude가 매주 11개 분석 단위(주요 5개 시장 · 6개 지역)별 시장 브리핑과 이를 묶은 전 시장 브리핑을 쓰는 차트봇.';
  window.MK = { BASE, CC, MAJORS, esc, json, name, briefFile, briefTabs, brief, allBriefs, parseBrief, md, itemHtml, plain, bolds, links, moves,
    evidence, signal, SIGNAL_RULES, SIGNAL_LABEL, weekly, countryWeekly, xm, genreShares, spark, el, errBox, icon, wk, day, n1, fmt, norm, findGames, ready, PROJECT };
})();

/*MK-CORE-END*/</script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  $('#intro').textContent = '31개국 앱스토어 게임 차트 · Claude 주간 시장 브리핑';
  const HL_MS = 8000, MK_MS = 24000;
  try {
    const [idx, lite, xraw, briefs] = await Promise.all([MK.json('index'), MK.json('weekly_lite'), MK.json('xmarket_lite'), MK.allBriefs()]);
    const X = MK.xm(xraw);
    const wkl = MK.weekly(lite, 'kr').labels;
    $('#stamp').textContent = '차트 갱신 ' + idx.generated + ' · 주간 ' + MK.wk(wkl[wkl.length - 1]) + ' · 브리핑 ' + MK.day(briefs[0].generated);
    const slides = [];
    briefs.forEach(b => MK.parseBrief(b.text).forEach(s => { if (s.headline) slides.push({ b, sec: s.title, md: s.headline.md }); }));
    let mi = 0, si = 0, paused = false, t0 = Date.now();
    function tile(l, v, f, cls, small) { return '<div class="t ' + (cls || '') + '"><div class="l">' + l + '</div><div class="v' + (small ? ' s' : '') + '">' + v + '</div><div class="f">' + (f || '') + '</div></div>'; }
    function renderMarket() {
      const cc = MK.MAJORS[mi], w = MK.weekly(lite, cc);
      const top = w.rows.find(r => r.id === w.top) || w.rows[0];
      const ni = w.rows.filter(r => r.isNew).length, no = w.rows.filter(r => r.isOut).length;
      $('#tiles').innerHTML =
        tile('추적 나라', X.markets.length, '앱스토어 매출 · 인기 차트 매일 수집') +
        tile('순위가 잡힌 게임', MK.fmt(Object.keys(X.games).length), X.date + ' 또는 7일 전에 어느 나라든 100위 안') +
        tile('이번 주 AI 브리핑', briefs.length + '<span style="font-size:.4em;font-weight:600"> 편</span>', '전 시장 1 · 주요 시장 5 · 지역 6 · Claude 작성 ' + MK.day(briefs[0].generated)) +
        tile(MK.name(cc) + ' 이번 주 1위', MK.esc(top.title), '연속 ' + w.topStreak + '주 · 주간 평균 ' + MK.n1(top.now) + '위', 'mk fade', true) +
        tile(MK.name(cc) + ' 새로 진입', '<span class="up">+' + ni + '</span>', '전주 대비 매출 상위 100 진입 게임 수', 'mk fade') +
        tile(MK.name(cc) + ' 차트 이탈', '<span class="down">−' + no + '</span>', '전주에는 있었고 이번 주 없는 게임 수', 'mk fade');
      const rows = w.rows.filter(r => r.now != null).slice(0, 5);
      $('#rank').innerHTML = '<h2>' + MK.name(cc) + ' 매출 TOP 5</h2><div class="sub">' + MK.wk(w.labels[w.n - 1]) + ' 주간 평균 순위 · 막대 길이 = 16 − 평균 순위(길수록 상위)</div><div class="bars fade">' +
        rows.map(r => { const d = r.delta == null ? (r.isNew ? 'NEW' : '') : r.delta > 0 ? '<span class="up">▲' + MK.n1(r.delta) + '</span>' : r.delta < 0 ? '<span class="down">▼' + MK.n1(-r.delta) + '</span>' : '–';
          return '<div class="bar"><div class="nm"><span>' + MK.esc(r.title) + '</span><span>' + MK.n1(r.now) + '위 ' + d + '</span></div><div class="tr"><i style="width:' + Math.max(4, (16 - r.now) / 15 * 100).toFixed(1) + '%"></i></div></div>'; }).join('') +
        '</div><div class="dots">' + MK.MAJORS.map((k, i) => '<i class="' + (i === mi ? 'on' : '') + '" title="' + MK.name(k) + '"></i>').join('') + '</div>';
    }
    function renderSlide() {
      const s = slides[si];
      $('#band').innerHTML = '<div class="meta"><span class="src">AI 헤드라인 · ' + MK.esc(s.b.tab.name) + '</span><span>' + MK.esc(s.sec) + ' · ' + (si + 1) + ' / ' + slides.length + '</span></div>' +
        '<div class="hl fade">' + MK.md(s.md, { noLinks: true }) + '</div>' +
        '<div class="foot"><span>Claude가 쓴 ' + MK.esc(s.b.tab.name) + ' 시장 브리핑 · ' + MK.day(s.b.generated) + ' 발행 · 섹션 첫 줄</span><span>' + (paused ? '멈춤 — 누르면 재생' : (HL_MS / 1000) + '초마다 넘어감 · 누르면 멈춤') + '</span></div><div class="prog" id="prog"></div>';
      $('#band').classList.toggle('paused', paused);
    }
    $('#band').addEventListener('click', () => { paused = !paused; t0 = Date.now(); renderSlide(); });
    document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { si = (si + 1) % slides.length; t0 = Date.now(); renderSlide(); } if (e.key === 'ArrowLeft') { si = (si - 1 + slides.length) % slides.length; t0 = Date.now(); renderSlide(); } });
    renderMarket(); renderSlide();
    MK.ready(true);
    let lastMk = Date.now();
    setInterval(() => {
      if (paused) return;
      const now = Date.now(), p = $('#prog');
      if (p) p.style.width = Math.min(100, (now - t0) / HL_MS * 100) + '%';
      if (now - t0 >= HL_MS) { si = (si + 1) % slides.length; t0 = now; renderSlide(); }
      if (now - lastMk >= MK_MS) { mi = (mi + 1) % MK.MAJORS.length; lastMk = now; renderMarket(); }
    }, 200);
  } catch (e) { MK.errBox('#tiles', e); MK.ready(false, String(e)); }
})();
</script>
</body>
</html>
