<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진입 · 이탈 폭포 · 견본 14</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#0f1720;--sub:#5d6b7a;--line:#d6dde5;--plus:#0f8a5f;--minus:#d1452f;--base:#3b4a5a;--ai:#13233a;--aiink:#e8eef6;--sel:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a{color:#1d5fbf}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{background:var(--panel);border-bottom:1px solid var(--line)}
.hd{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between}
.hd h1{margin:0;font-size:16px}
.hd h1 span{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sub);margin-right:8px}
.hd p{margin:0;font-size:12px;color:var(--sub);flex-basis:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:#fff;padding:6px 14px;cursor:pointer;border-right:1px solid var(--line);color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.grid{max-width:1320px;margin:0 auto;padding:16px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.box h2{font-size:15px;margin:0 0 2px}
.box .cap{font-size:12px;color:var(--sub);margin:0 0 10px}
.wf{width:100%}
.wf .row{display:grid;grid-template-columns:118px minmax(0,1fr) 92px;gap:8px;align-items:center;height:26px;cursor:pointer;border-radius:4px}
.wf .row:hover{background:#f4f6f9}
.wf .row.sel{background:#fff6d6;outline:1px solid var(--sel)}
.wf .row.base{cursor:default;font-weight:700}
.wf .lab{font-size:12.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf .trk{position:relative;height:16px}
.wf .trk i{position:absolute;top:0;height:100%;border-radius:2px}
.wf .trk .conn{position:absolute;top:-6px;height:6px;border-left:1px dashed #9aa7b5}
.wf .v{font-size:12px;white-space:nowrap}
.wf .v .p{color:var(--plus)}.wf .v .m{color:var(--minus)}
.axis{display:grid;grid-template-columns:118px minmax(0,1fr) 92px;gap:8px;font-size:11px;color:var(--sub);margin-top:4px}
.axis .ticks{position:relative;height:16px;border-top:1px solid var(--line)}
.axis .ticks span{position:absolute;transform:translateX(-50%);top:2px}
.zero{font-size:12px;color:var(--sub);margin-top:10px}
.drill{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drill h3{font-size:13px;margin:0 0 6px}
.drill ul{list-style:none;margin:0;padding:0}
.drill li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #eef1f4;font-size:13px}
.drill li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drill li .t small{color:var(--sub);display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.mk-icon{width:24px;height:24px;border-radius:6px;background:#e4e9ef;display:block}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.k .l{font-size:11.5px;color:var(--sub)}
.k .v{font-size:24px;font-weight:700;line-height:1.2}
.k.wide{grid-column:1/-1}
.k.wide .v{font-size:15px;line-height:1.4}
.k .p{color:var(--plus)}.k .m{color:var(--minus)}
.ai{background:var(--ai);color:var(--aiink);border-radius:10px;padding:16px 18px}
.ai .tag{font-size:11px;letter-spacing:.08em;color:#8fb4e8;font-weight:700}
.ai h2{font-size:15px;margin:4px 0 2px;color:#fff}
.ai .by{font-size:11.5px;color:#9fb0c6;margin-bottom:10px}
.ai .head{font-size:15px;font-weight:600;color:#fff;border-left:3px solid var(--sel);padding-left:10px;margin-bottom:10px}
.ai ul{margin:0;padding-left:16px}
.ai li{margin:7px 0;font-size:13.5px}
.ai b{color:#fff}
.ai .mk-up{color:#5fe0a8;font-weight:700}.ai .mk-down{color:#ff8a76;font-weight:700}
.ai .mk-q{color:#9fb0c6;quotes:none;display:block;font-size:12.5px}
.ai a{color:#8fb4e8}
.chip{display:inline-block;font:inherit;font-size:11px;border:1px solid #3d5576;border-radius:4px;padding:0 6px;margin:2px 3px 0 0;background:#1c3150;color:#dbe6f5;cursor:pointer}
.chip.n{border-color:#2f8a64}.chip.o{border-color:#b9553f}
.ai .rule{font-size:11.5px;color:#8fa1b8;margin-top:10px;border-top:1px solid #2a3d58;padding-top:8px}
.mk-up{color:var(--plus);font-weight:700}.mk-down{color:var(--minus);font-weight:700}
.mk-err{background:#fff0ef;border:1px solid #f3b9b4;color:#8a1f17;padding:12px 14px;border-radius:8px;margin:16px 0}
footer{max-width:1320px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--sub)}
@media (max-width:1000px){.grid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:520px){.grid,.hd,footer{padding-left:16px;padding-right:16px}.wf .row,.axis{grid-template-columns:84px minmax(0,1fr) 70px}.drill{grid-template-columns:1fr}.seg button{padding:6px 10px}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1><span>견본 14</span>진입 · 이탈 폭포</h1>
    <div class="seg" id="tabs" role="group" aria-label="시장"></div>
    <p id="intro"></p>
    <p><a href="index.html">견본 목록</a> · <span id="stamp">불러오는 중…</span></p>
  </div>
</header>
<div class="grid">
  <section class="box">
    <h2 id="wf-title">매출 차트 장르별 진입 · 이탈</h2>
    <p class="cap" id="wf-cap"></p>
    <div class="wf" id="wf" role="list"></div>
    <div class="axis"><span></span><div class="ticks" id="ticks"></div><span></span></div>
    <p class="zero" id="zero"></p>
    <div class="drill" id="drill"></div>
  </section>
  <aside class="side">
    <div class="box"><h2>이번 주 숫자</h2><p class="cap" id="kcap"></p><div class="kp" id="kp"></div></div>
    <div class="ai" id="ai" aria-live="polite"></div>
  </aside>
</div>
<footer>데이터: weekly_lite.json(주간 평균 순위, 마지막 두 주) · &lt;시장&gt;.json(게임 장르) · xmarket_lite.json(장르 보조) · briefs_index.json · major_&lt;시장&gt;.json(Claude 브리핑). 차트에 '있다'는 그 주 하루라도 매출 상위 100에 든 것.</footer>
<script>/*MK-CORE-BEGIN*/
/* MK core — 견본 공통 도우미(각 견본 HTML 안에 그대로 들어 있다. 원본: 견본 작업 세션의 core.js)
   데이터: 저장소 루트에서 정적 서버로 열었을 때 ../docs/markets/ 아래 JSON을 읽는다. */
(function () {
  'use strict';
  const BASE = '../docs/markets/';
  const cache = {};
  const CC = {
    global: '전 시장', cn: '중국', jp: '일본', kr: '한국', tw: '대만', us: '미국', ae: 'UAE', ar: '아르헨티나', au: '호주',
    br: '브라질', ca: '캐나다', co: '콜롬비아', de: '독일', eg: '이집트', es: '스페인', fr: '프랑스', gb: '영국',
    id: '인도네시아', in: '인도', it: '이탈리아', mx: '멕시코', my: '말레이시아', nl: '네덜란드', ph: '필리핀',
    pk: '파키스탄', ru: '러시아', sa: '사우디', se: '스웨덴', sg: '싱가포르', th: '태국', tr: '터키', vn: '베트남',
    europe: '유럽', na_oceania: '북미·오세아니아', middle_east: '중동', latam: '중남미', sea: '동남아', south_asia: '남아시아'
  };
  const MAJORS = ['kr', 'us', 'jp', 'cn', 'tw'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  async function json(name) {
    if (cache[name]) return cache[name];
    const url = BASE + name + '.json';
    cache[name] = fetch(url).then(r => {
      if (!r.ok) throw new Error(url + ' 응답 ' + r.status);
      return r.json();
    });
    try { return await cache[name]; } catch (e) { delete cache[name]; throw e; }
  }
  function name(k) { return CC[k] || (k ? String(k).toUpperCase() : ''); }
  function briefFile(tab) {
    if (!tab || tab.key === 'global' || tab.type === 'global') return 'global_brief';
    return (tab.type === 'major' ? 'major_' : 'region_') + tab.key;
  }
  /* 브리핑 목록: [{key,type,name,file}] — 맨 앞은 전 시장 */
  async function briefTabs() {
    const idx = await json('briefs_index');
    return [{ key: 'global', type: 'global', name: '전 시장', file: 'global_brief' }]
      .concat((idx.tabs || []).map(t => ({ key: t.key, type: t.type, name: t.name, countries: t.countries, file: briefFile(t) })));
  }
  /* 브리핑 한 개: {tab, generated, text, history:[{date,text}], monthly, quarterly} */
  async function brief(tab) {
    const d = await json(tab.file || briefFile(tab));
    const w = (d.axes && d.axes.weekly) || { text: d.text, history: d.history, generated: d.generated };
    return {
      tab, raw: d, generated: w.generated || d.generated, text: w.text || d.text || '', model: w.model || '',
      history: (w.history || d.history || []).map(h => ({ date: h.date, generated: h.generated, text: h.text })),
      monthly: d.axes && d.axes.monthly ? d.axes.monthly.text : '', quarterly: d.axes && d.axes.quarterly ? d.axes.quarterly.text : ''
    };
  }
  async function allBriefs() {
    const tabs = await briefTabs();
    return Promise.all(tabs.map(t => brief(t)));
  }
  /* 브리핑 글 → 섹션. 섹션의 첫 항목이 헤드라인(요약), 나머지가 상세. '- '로 시작하지 않는 줄은 앞 항목에 붙는 인용(매체 인용문). */
  function parseBrief(text) {
    const out = [];
    let sec = null, last = null;
    String(text || '').split('\n').forEach(line => {
      const l = line.replace(/\s+$/, '');
      if (!l.trim()) return;
      const h = l.match(/^#{1,3}\s+(.*)$/);
      if (h) { sec = { title: h[1].trim(), items: [] }; out.push(sec); last = null; return; }
      if (!sec) { sec = { title: '', items: [] }; out.push(sec); }
      const b = l.match(/^\s*[-*]\s+(.*)$/);
      if (b) { last = { md: b[1].trim(), quotes: [] }; sec.items.push(last); return; }
      if (last) last.quotes.push(l.trim()); else { last = { md: l.trim(), quotes: [] }; sec.items.push(last); }
    });
    out.forEach(s => {
      s.headline = s.items.length ? s.items[0] : null;
      s.details = s.items.slice(1);
      s.items.forEach(it => {
        it.text = plain(it.md + (it.quotes.length ? ' ' + it.quotes.join(' ') : ''));
        it.full = it.quotes.length ? it.md + ' “' + it.quotes.join(' ') + '”' : it.md;
      });
    });
    return out;
  }
  /* 인라인 마크다운(굵게, 링크, ▲▼ 숫자) → HTML */
  function md(s, opt) {
    opt = opt || {};
    let h = esc(s);
    h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => opt.noLinks ? t : '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>');
    h = h.replace(/\*\*([^*]+)\*\*/g, (m, t) => '<b>' + t + '</b>');
    h = h.replace(/▲\s?(\d+(?:\.\d+)?)/g, '<span class="mk-up">▲$1</span>').replace(/▼\s?(\d+(?:\.\d+)?)/g, '<span class="mk-down">▼$1</span>');
    if (opt.mark && opt.mark.length) {
      opt.mark.filter(Boolean).forEach(w => {
        const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'g');
        h = h.replace(re, '<mark>$1</mark>');
      });
    }
    return h;
  }
  function itemHtml(it, opt) {
    let h = md(it.md, opt);
    if (it.quotes && it.quotes.length) h += ' <q class="mk-q">' + md(it.quotes.join(' '), opt) + '</q>';
    return h;
  }
  function plain(s) { return String(s || '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\*\*/g, ''); }
  function bolds(s) { const r = []; String(s || '').replace(/\*\*([^*]+)\*\*/g, (m, t) => { r.push(t.trim()); }); return r; }
  function links(s) { const r = []; String(s || '').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => { r.push({ t, u }); }); return r; }
  function moves(s) { const r = []; String(s || '').replace(/([▲▼])\s?(\d+(?:\.\d+)?)/g, (m, a, v) => { r.push({ dir: a === '▲' ? 1 : -1, v: +v }); }); return r; }
  /* 시사점 문장 끝 괄호(근거) 떼기 */
  function evidence(s) {
    const t = String(s || '').trim();
    if (!t.endsWith(')')) return { claim: t, evidence: '' };
    let depth = 0;
    for (let i = t.length - 1; i >= 0; i--) {
      if (t[i] === ')') depth++;
      else if (t[i] === '(') { depth--; if (depth === 0) return { claim: t.slice(0, i).trim(), evidence: t.slice(i + 1, -1).trim() }; }
    }
    return { claim: t, evidence: '' };
  }
  /* 권고 문장의 신호(규칙 기반): go 우선 · watch 관망 · hold 보류 */
  /* 강한 표현이 약한 표현보다 먼저 판정한다. 관망 표현이 있으면 관망. 우선 · 보류 강한 표현이 함께 있으면 혼재. */
  const SIG = {
    watch: ['확인 후', '불확실', '2~3주', '구분 불가', '미룸', '관망', '아직 이름', '판단 근거로 쓰기에는'],
    holdStrong: ['보류', '하향', '후순위'],
    goStrong: ['우선순위 상위', '1순위', '진출 우선'],
    holdWeak: ['포화', '리스크가 큼', '리스크 큼', '어려', '제한적', '여지가 없'],
    goWeak: ['유지', '유리', '기회', '현실적', '낮은 편', '가능']
  };
  function signal(text) {
    const t = plain(text);
    const hit = {};
    Object.keys(SIG).forEach(k => { hit[k] = SIG[k].filter(w => t.includes(w)); });
    let s = null;
    if (hit.watch.length) s = 'watch';
    else if (hit.goStrong.length && hit.holdStrong.length) s = 'mixed';
    else if (hit.holdStrong.length) s = 'hold';
    else if (hit.goStrong.length) s = 'go';
    else if (hit.holdWeak.length && hit.goWeak.length) s = 'mixed';
    else if (hit.holdWeak.length) s = 'hold';
    else if (hit.goWeak.length) s = 'go';
    const words = [].concat(hit.watch, hit.goStrong, hit.holdStrong, hit.goWeak, hit.holdWeak);
    return { signal: s, hits: hit, words };
  }
  const SIGNAL_LABEL = { go: '우선', watch: '관망', hold: '보류', mixed: '혼재' };
  const SIGNAL_RULES = SIG;
  /* 주간 순위 요약(weekly_lite) 한 시장 */
  function weekly(lite, mk, chart) {
    const c = (((lite || {}).markets || {})[mk] || {}).charts || {};
    const ch = c[chart || 'grossing'] || { games: {}, timeframes: { weekly: { labels: [], series: {} } } };
    const tf = ch.timeframes.weekly, labels = tf.labels || [], n = labels.length, ni = n - 1, pi = n - 2;
    const rows = Object.keys(tf.series).map(id => {
      const v = tf.series[id], g = ch.games[id] || {};
      const now = v[ni] == null ? null : v[ni], prev = v[pi] == null ? null : v[pi];
      return { id, title: g.title || id, dev: g.developer || '', icon: g.icon || '', now, prev, series: v,
        delta: now != null && prev != null ? +(prev - now).toFixed(1) : null, isNew: now != null && prev == null, isOut: now == null && prev != null };
    });
    rows.sort((a, b) => (a.now == null ? 999 : a.now) - (b.now == null ? 999 : b.now));
    /* 주마다 1위(평균 순위가 가장 낮은 게임) */
    const tops = [];
    for (let i = 0; i < n; i++) {
      let best = null, ba = null;
      for (const id in tf.series) { const x = tf.series[id][i]; if (x != null && (best == null || x < best)) { best = x; ba = id; } }
      tops.push(ba);
    }
    let streak = 0; const top = tops[ni];
    for (let i = ni; i >= 0 && tops[i] === top; i--) streak++;
    return { labels, n, rows, tops, top, topStreak: streak, games: ch.games, series: tf.series };
  }
  /* 나라 파일(<cc>.json)의 주간 시계열 전체 */
  function countryWeekly(co, chart) {
    const ch = ((co || {}).charts || {})[chart || 'grossing'] || {};
    const tf = (ch.timeframes || {}).weekly || { labels: [], series: {} };
    return { labels: tf.labels || [], series: tf.series || {}, games: ch.games || {}, publishers: ch.publishers, genres: ch.genres, daily: (ch.timeframes || {}).daily, monthly: (ch.timeframes || {}).monthly };
  }
  /* 여러 나라 순위 요약(xmarket_lite) 풀기 */
  function xm(x) {
    const mk = x.markets || [];
    const games = {};
    Object.keys(x.games || {}).forEach(id => {
      const g = x.games[id];
      const o = { id, title: g.t, dev: g.d, icon: g.i ? (x.icon_head + g.i + x.icon_tail) : '', genre: g.gr || '', release: g.rl, updated: g.up, g: {}, f: {} };
      (g.g || []).forEach(r => { o.g[mk[r[0]]] = { now: r[1], prev: r[2] }; });
      (g.f || []).forEach(r => { o.f[mk[r[0]]] = { now: r[1], prev: r[2] }; });
      games[id] = o;
    });
    function top(cc, kind, n) {
      kind = kind || 'g';
      return Object.values(games).filter(o => o[kind][cc] && o[kind][cc].now != null)
        .sort((a, b) => a[kind][cc].now - b[kind][cc].now).slice(0, n || 100);
    }
    return { date: x.date, markets: mk, games, top };
  }
  function genreShares(gm, key) {
    const c = (gm.cells || {})[key] || {};
    return Object.keys(c).map(g => ({ genre: g, rev: c[g].rev, pre: c[g].pre })).sort((a, b) => b.rev - a.rev);
  }
  /* SVG 도우미 */
  function spark(vals, o) {
    o = Object.assign({ w: 120, h: 28, invert: false, stroke: 'currentColor', width: 1.5, fill: '', dot: true, min: null, max: null, pad: 2 }, o || {});
    const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
    if (!pts.length) return '<svg width="' + o.w + '" height="' + o.h + '"></svg>';
    const ys = pts.map(p => p[1]);
    const mn = o.min != null ? o.min : Math.min.apply(null, ys), mx = o.max != null ? o.max : Math.max.apply(null, ys);
    const X = i => o.pad + (vals.length < 2 ? 0 : i * (o.w - 2 * o.pad) / (vals.length - 1));
    const Y = v => { const t = mx === mn ? 0.5 : (v - mn) / (mx - mn); return o.pad + (o.invert ? t : 1 - t) * (o.h - 2 * o.pad); };
    let d = '', seg = false;
    vals.forEach((v, i) => { if (v == null) { seg = false; return; } d += (seg ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); seg = true; });
    const lp = pts[pts.length - 1];
    let s = '<svg class="mk-spark" width="' + o.w + '" height="' + o.h + '" viewBox="0 0 ' + o.w + ' ' + o.h + '" aria-hidden="true">';
    if (o.band) s += '<rect x="0" y="' + Math.min(Y(o.band[0]), Y(o.band[1])).toFixed(1) + '" width="' + o.w + '" height="' + Math.abs(Y(o.band[0]) - Y(o.band[1])).toFixed(1) + '" fill="' + (o.bandFill || 'rgba(0,0,0,.08)') + '"/>';
    s += '<path d="' + d + '" fill="none" stroke="' + o.stroke + '" stroke-width="' + o.width + '" stroke-linejoin="round" stroke-linecap="round"/>';
    if (o.dot) s += '<circle cx="' + X(lp[0]).toFixed(1) + '" cy="' + Y(lp[1]).toFixed(1) + '" r="' + (o.width + 1) + '" fill="' + (o.dotColor || o.stroke) + '"/>';
    return s + '</svg>';
  }
  function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function errBox(target, e) {
    const node = typeof target === 'string' ? document.querySelector(target) : target;
    const msg = '<div class="mk-err" role="alert"><b>데이터를 불러오지 못했습니다.</b> ' + esc(e && e.message ? e.message : e) +
      '<br>저장소 루트에서 정적 서버를 띄우고(<code>python3 -m http.server</code>) <code>/mockups/</code> 아래 주소로 열어 주세요.</div>';
    if (node) node.innerHTML = msg; else document.body.insertAdjacentHTML('afterbegin', msg);
    console.warn('[MK] load failed', e);
  }
  function icon(url, cls) { return url ? '<img class="' + (cls || 'mk-icon') + '" src="' + esc(url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'">' : '<span class="' + (cls || 'mk-icon') + '"></span>'; }
  function wk(label) { if (!label) return ''; const p = label.split('-'); return (+p[1]) + '/' + (+p[2]) + ' 주'; }
  function day(s) { if (!s) return ''; const p = String(s).slice(0, 10).split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
  function n1(v) { return v == null || isNaN(v) ? '–' : (Math.round(v * 10) / 10).toFixed(1); }
  function fmt(v, d) { return v == null || isNaN(v) ? '–' : Number(v).toLocaleString('ko-KR', { maximumFractionDigits: d == null ? 0 : d }); }
  /* 이름 비교용: 공백 · 기호를 빼고 소문자 */
  function norm(s) { return String(s || '').toLowerCase().replace(/[\s:：·・\-_'’"“”()（）\[\]!！?？.,®™]/g, ''); }
  /* 브리핑 문장에서 이름이 나온 게임 찾기: games = [{id,title}] */
  function findGames(text, games) {
    const names = bolds(text).map(norm).filter(x => x.length >= 2);
    const t = norm(plain(text));
    return games.filter(g => { const n = norm(g.title); if (n.length < 2) return false; return names.some(b => b === n || (b.length >= 3 && (n.startsWith(b) || b.startsWith(n)))) || (n.length >= 4 && t.includes(n)); });
  }
  /* 화면이 다 그려졌는지 확인 스크립트에 알린다 */
  function ready(ok, note) { document.documentElement.setAttribute('data-mk-ready', ok ? 'ok' : 'error'); if (note) document.documentElement.setAttribute('data-mk-note', note); }
  const PROJECT = '앱스토어(App Store) 31개국 게임 매출 · 인기 차트를 매일 모으고, Claude가 매주 11개 분석 단위(주요 5개 시장 · 6개 지역)별 시장 브리핑과 이를 묶은 전 시장 브리핑을 쓰는 차트봇.';
  window.MK = { BASE, CC, MAJORS, esc, json, name, briefFile, briefTabs, brief, allBriefs, parseBrief, md, itemHtml, plain, bolds, links, moves,
    evidence, signal, SIGNAL_RULES, SIGNAL_LABEL, weekly, countryWeekly, xm, genreShares, spark, el, errBox, icon, wk, day, n1, fmt, norm, findGames, ready, PROJECT };
})();

/*MK-CORE-END*/</script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  $('#intro').textContent = MK.PROJECT;
  try {
    const [lite, xraw, tabs] = await Promise.all([MK.json('weekly_lite'), MK.json('xmarket_lite'), MK.briefTabs()]);
    const X = MK.xm(xraw);
    let cc = 'kr', selGenre = null, model = null;
    $('#tabs').innerHTML = MK.MAJORS.map(k => '<button type="button" data-k="' + k + '" aria-pressed="' + (k === cc) + '">' + MK.name(k) + '</button>').join('');
    $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cc = b.dataset.k; selGenre = null;
      $('#tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); load().catch(err => MK.errBox('#wf', err)); });

    async function load() {
      $('#wf').innerHTML = '<p class="cap">불러오는 중…</p>';
      const tab = tabs.find(t => t.key === cc);
      const [co, br] = await Promise.all([MK.json(cc), MK.brief(tab)]);
      const meta = MK.countryWeekly(co).games;
      const w = MK.weekly(lite, cc);
      const genreOf = id => ((meta[id] || {}).genre) || ((X.games[id] || {}).genre) || '장르 미상';
      const g = {};
      const add = (r, k) => { const ge = genreOf(r.id); (g[ge] = g[ge] || { genre: ge, inn: [], out: [] })[k].push(r); };
      w.rows.forEach(r => { if (r.isNew) add(r, 'inn'); if (r.isOut) add(r, 'out'); });
      const prevN = w.rows.filter(r => r.prev != null).length, nowN = w.rows.filter(r => r.now != null).length;
      const list = Object.values(g).map(o => Object.assign(o, { net: o.inn.length - o.out.length }));
      const moving = list.filter(o => o.net !== 0).sort((a, b) => b.net - a.net || b.inn.length - a.inn.length);
      const swap = list.filter(o => o.net === 0);
      const both = w.rows.filter(r => r.delta != null);
      const up = both.slice().sort((a, b) => b.delta - a.delta)[0], dn = both.slice().sort((a, b) => a.delta - b.delta)[0];
      model = { w, br, g, list, moving, swap, prevN, nowN, up, dn, genreOf };
      $('#stamp').textContent = '주간 순위 ' + MK.wk(w.labels[w.n - 2]) + ' → ' + MK.wk(w.labels[w.n - 1]) + ' · 브리핑 Claude ' + MK.day(br.generated) + ' 발행 · 장르 ' + MK.day(co.generated);
      $('#wf-title').textContent = MK.name(cc) + ' 매출 차트, 장르별 진입 · 이탈';
      $('#wf-cap').textContent = '지난주 차트 게임 수에서 시작해 장르별 순증감(진입 − 이탈)을 더하면 이번 주 게임 수가 된다. 가로축은 0에서 시작하지 않는다. 행을 누르면 그 장르로 들어오고 나간 게임이 아래에 나온다.';
      renderWF(); renderKP(); renderAI();
    }
    function renderWF() {
      const m = model;
      const steps = [{ base: true, label: '지난주', a: 0, b: m.prevN }];
      let cur = m.prevN;
      m.moving.forEach(o => { steps.push({ genre: o.genre, a: cur, b: cur + o.net, o }); cur += o.net; });
      steps.push({ base: true, label: '이번 주', a: 0, b: m.nowN });
      const vals = steps.filter(s => !s.base).map(s => [s.a, s.b]).flat().concat([m.prevN, m.nowN]);
      const lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 4) / 5) * 5), hi = Math.ceil((Math.max.apply(null, vals) + 2) / 5) * 5;
      const P = v => ((v - lo) / (hi - lo) * 100);
      $('#wf').innerHTML = steps.map((s, i) => {
        if (s.base) return '<div class="row base" role="listitem"><span class="lab">' + s.label + '</span><span class="trk"><i style="left:0;width:' + P(s.b).toFixed(2) + '%;background:var(--base)"></i></span><span class="v num">' + s.b + '개</span></div>';
        const l = Math.min(P(s.a), P(s.b)), wd = Math.abs(P(s.b) - P(s.a));
        const pos = s.o.net > 0;
        return '<div class="row' + (selGenre === s.genre ? ' sel' : '') + '" role="listitem" tabindex="0" data-g="' + MK.esc(s.genre) + '"><span class="lab" title="' + MK.esc(s.genre) + '">' + MK.esc(s.genre) + '</span><span class="trk"><span class="conn" style="left:' + P(s.a).toFixed(2) + '%"></span><i style="left:' + l.toFixed(2) + '%;width:' + Math.max(.6, wd).toFixed(2) + '%;background:var(--' + (pos ? 'plus' : 'minus') + ')"></i></span>' +
          '<span class="v num"><b class="' + (pos ? 'p' : 'm') + '">' + (pos ? '+' : '') + s.o.net + '</b> <span style="color:var(--sub)">(+' + s.o.inn.length + '/−' + s.o.out.length + ')</span></span></div>';
      }).join('');
      const tk = [];
      for (let v = lo; v <= hi; v += Math.max(5, Math.round((hi - lo) / 6 / 5) * 5)) tk.push(v);
      $('#ticks').innerHTML = tk.map(v => '<span class="num" style="left:' + P(v) + '%">' + v + '</span>').join('');
      $('#zero').innerHTML = m.swap.length ? '<b>교체만 있었던 장르</b>(순증감 0): ' + m.swap.map(o => MK.esc(o.genre) + ' <span class="num">+' + o.inn.length + '/−' + o.out.length + '</span>').join(' · ') : '';
      renderDrill();
    }
    function li(r, kind) {
      const rk = kind === 'in' ? '평균 ' + MK.n1(r.now) + '위' : '지난주 ' + MK.n1(r.prev) + '위';
      return '<li>' + MK.icon(r.icon) + '<span class="t">' + MK.esc(r.title) + '<small>' + MK.esc(r.dev) + '</small></span><span class="num" style="font-size:12px">' + rk + '</span></li>';
    }
    function renderDrill() {
      const m = model;
      let inn, out, title;
      if (selGenre && m.g[selGenre]) { inn = m.g[selGenre].inn; out = m.g[selGenre].out; title = '「' + selGenre + '」 '; }
      else { inn = m.w.rows.filter(r => r.isNew); out = m.w.rows.filter(r => r.isOut); title = '전체 '; }
      inn = inn.slice().sort((a, b) => a.now - b.now); out = out.slice().sort((a, b) => a.prev - b.prev);
      $('#drill').innerHTML = '<div><h3>' + MK.esc(title) + '진입 <span class="mk-up num">' + inn.length + '</span></h3><ul>' + (inn.map(r => li(r, 'in')).join('') || '<li>없음</li>') + '</ul></div>' +
        '<div><h3>' + MK.esc(title) + '이탈 <span class="mk-down num">' + out.length + '</span></h3><ul>' + (out.map(r => li(r, 'out')).join('') || '<li>없음</li>') + '</ul></div>';
    }
    $('#wf').addEventListener('click', e => { const r = e.target.closest('.row[data-g]'); if (!r) return; selGenre = selGenre === r.dataset.g ? null : r.dataset.g; renderWF(); });
    $('#wf').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = e.target.closest('.row[data-g]'); if (r) r.click(); } });
    function renderKP() {
      const m = model, ni = m.w.rows.filter(r => r.isNew).length, no = m.w.rows.filter(r => r.isOut).length, net = m.nowN - m.prevN;
      $('#kcap').textContent = MK.name(cc) + ' 매출 상위 100, ' + MK.wk(m.w.labels[m.w.n - 1]) + ' 대 전주';
      $('#kp').innerHTML = '<div class="k"><div class="l">진입</div><div class="v num p">' + ni + '</div></div><div class="k"><div class="l">이탈</div><div class="v num m">' + no + '</div></div>' +
        '<div class="k"><div class="l">차트 게임 수</div><div class="v num">' + m.nowN + '</div></div><div class="k"><div class="l">전주 대비</div><div class="v num ' + (net >= 0 ? 'p' : 'm') + '">' + (net > 0 ? '+' : '') + net + '</div></div>' +
        (m.up ? '<div class="k wide"><div class="l">주간 평균 순위 상승 1위</div><div class="v">' + MK.esc(m.up.title) + ' <span class="mk-up num">▲' + MK.n1(m.up.delta) + '</span> <small class="num" style="color:var(--sub)">' + MK.n1(m.up.prev) + '→' + MK.n1(m.up.now) + '위</small></div></div>' : '') +
        (m.dn ? '<div class="k wide"><div class="l">주간 평균 순위 하락 1위</div><div class="v">' + MK.esc(m.dn.title) + ' <span class="mk-down num">▼' + MK.n1(-m.dn.delta) + '</span> <small class="num" style="color:var(--sub)">' + MK.n1(m.dn.prev) + '→' + MK.n1(m.dn.now) + '위</small></div></div>' : '');
    }
    function renderAI() {
      const m = model;
      const secs = MK.parseBrief(m.br.text);
      const mv = secs.find(s => s.title.includes('변동')) || secs[0];
      const all = m.w.rows;
      function tags(it) {
        return MK.findGames(it.md + ' ' + it.quotes.join(' '), all).map(r => {
          const ge = m.genreOf(r.id);
          const kind = r.isNew ? ['n', '진입'] : r.isOut ? ['o', '이탈'] : r.delta != null ? ['', (r.delta >= 0 ? '▲' : '▼') + MK.n1(Math.abs(r.delta))] : ['', '데이터 없음'];
          return '<button type="button" class="chip ' + kind[0] + '" data-g="' + MK.esc(ge) + '">' + MK.esc(r.title) + ' · ' + MK.esc(ge) + ' · ' + kind[1] + '</button>';
        }).join('');
      }
      $('#ai').innerHTML = '<div class="tag">AI 해설 · 왜 움직였나</div><h2>' + MK.esc(mv.title) + '</h2><div class="by">Claude가 쓴 ' + MK.name(cc) + ' 시장 브리핑 · ' + MK.day(m.br.generated) + ' 발행</div>' +
        (mv.headline ? '<div class="head">' + MK.md(mv.headline.md) + '</div>' : '') +
        '<ul>' + mv.details.map(it => '<li>' + MK.itemHtml(it) + '<div>' + tags(it) + '</div></li>').join('') + '</ul>' +
        '<div class="rule">칩 = 문장에 나온 게임을 이번 주 데이터에서 찾은 결과(장르 · 진입/이탈 · 주간 평균 순위 변동). 칩을 누르면 폭포의 그 장르 행이 선택된다. 브리핑의 ▲ · ▼ 숫자는 브리핑이 쓴 기준이고, 칩의 숫자는 weekly_lite.json의 주간 평균 순위 차이라 서로 다를 수 있다.</div>';
    }
    $('#ai').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; const ge = c.dataset.g; selGenre = model.g[ge] ? ge : null; renderWF(); document.querySelector('#wf').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    await load();
    MK.ready(true);
  } catch (e) { MK.errBox('#wf', e); MK.ready(false, String(e)); }
})();
</script>
